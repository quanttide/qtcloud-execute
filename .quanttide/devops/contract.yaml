# qtcloud-execute 契约配置（对齐 qtcloud-devops/.quanttide/devops/contract.yaml 结构）
# scope 定义：studio / site / provider / cli。详见 qtcloud-devops 的 src/cli/docs/contract/。

stages:
  build:
    command: cargo build --release
  test:
    command: cargo test
    threshold: 70
  release:
    changelog: CHANGELOG.md

platform:
  source_control: github
  pipeline: github_actions
  artifact_registry: github_releases

scopes:
  studio:
    dir: src/studio
    language: dart
    framework: flutter
    build_tool: flutter
    registry: pubdev
    ci_workflow: deploy-studio
  site:
    dir: src/site
    language: typescript
    framework: vite
    build_tool: npm
    registry: github_releases
    ci_workflow: deploy-site
  provider:
    dir: src/provider
    language: go
    framework: net/http
    build_tool: go
    registry: github_releases
    ci_workflow: deploy-provider
  cli:
    dir: src/cli
    language: rust
    framework: clap
    build_tool: cargo
    registry: crates
    release:
      changelog: src/cli/CHANGELOG.md
    test_threshold: 90
    ci_workflow: release-cli
