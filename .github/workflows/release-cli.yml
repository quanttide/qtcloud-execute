# 发布 CLI：推送 tag（cli/*，如 cli/v0.1.0-alpha.2）时：
#   check → build-binaries（多平台矩阵）→ publish-crate（crates.io，qtcloud-devops 惯例）
#   另保留 attach-release：把各平台二进制挂到 GitHub Release（发布资产）。
#
# 结构对齐 qtcloud-devops/.github/workflows/release-cli.yml；无 Python（maturin/PyPI 相关省略）。

name: release-cli

on:
  push:
    tags:
      - 'cli/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#cli/}" >> $GITHUB_OUTPUT
      - name: validate version
        run: ./scripts/validate-version.sh "${{ github.ref_name }}"
      - name: validate changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ./scripts/validate-changelog.sh "${VERSION#v}"

  build-binaries:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: build binary
        run: |
          cargo build --release --target ${{ matrix.target }}
          # 资产名带 cli（对齐 crate qtcloud-execute-cli，避免与其他组件产物冲突）；
          # gh release upload 不支持重命名，故复制为带 scope+target 后缀的唯一文件名
          cp "target/${{ matrix.target }}/release/qtcloud-execute${{ matrix.ext }}" \
             "qtcloud-execute-cli-${{ matrix.target }}${{ matrix.ext }}"
      - name: upload binary
        uses: actions/upload-artifact@v5
        with:
          name: qtcloud-execute-cli-${{ matrix.target }}
          path: qtcloud-execute-cli-${{ matrix.target }}${{ matrix.ext }}

  publish-crate:
    needs: build-binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CRATES_API_TOKEN }}

  # 保留：发布二进制到 GitHub Release（各平台产物，目标名后缀区分）
  attach-release:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: download binaries
        uses: actions/download-artifact@v5
        with:
          pattern: qtcloud-execute-cli-*
          path: dist
      - name: attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          # 文件已带 qtcloud-execute-cli-<target> 唯一名，直接上传（clobber 幂等）
          for dir in dist/qtcloud-execute-cli-*; do
            [ -d "$dir" ] || continue
            for bin in "$dir"/*; do
              [ -f "$bin" ] || continue
              echo "attach: ${bin}"
              gh release upload "${GITHUB_REF_NAME}" "$bin" --clobber
            done
          done
