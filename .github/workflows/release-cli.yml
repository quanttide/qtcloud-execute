# 发布 CLI：推送 tag（cli/*，如 cli/v0.1.0-alpha.2）时，
# 先 check（版本/changelog 校验，见 src/cli/scripts/），再 build-binaries（多平台矩阵），再 publish-crate（crates.io）。
#
# 结构对齐 qtcloud-devops/.github/workflows/release-cli.yml；
# 仅去掉 Python 相关（build-package / publish-pypi）——qtcloud-execute cli 为纯 Rust 二进制，无 pyproject/maturin。

name: release-cli

on:
  push:
    tags:
      - 'cli/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#cli/}" >> $GITHUB_OUTPUT
      - name: validate version
        run: ./scripts/validate-version.sh "${{ github.ref_name }}"
      - name: validate changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ./scripts/validate-changelog.sh "${VERSION#v}"

  build-binaries:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: build binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: upload binary
        uses: actions/upload-artifact@v5
        with:
          name: qtcloud-execute-${{ matrix.target }}
          path: ${{ github.workspace }}/src/cli/target/${{ matrix.target }}/release/qtcloud-execute${{ matrix.ext }}

  publish-crate:
    needs: build-binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CRATES_API_TOKEN }}
